experiments:

  # ===================================================================
  # Group 1: VV HNM 2048 (Run 1 ~ 4)
  # ===================================================================
  - experiment_name: 'SegFormer_B5_Aux_VV_2048_Run1'
    mode: 'train'
    architecture: 'segformer_aux'
    architecture_cfg:
      hf_model_name: 'nvidia/segformer-b5-finetuned-ade-640-640'
      in_channels: 3
      aux_loss_weight: 0.6
      aux_in_channels: 320
    cross_validation:
      enabled: True
      k_folds: 3
      random_state: 42
    dataset:
      path: '/home/sean/oil_11_26/dataset/DV4_SAR_Small_v3_relabel/04_HNM_Experiments/VV_HNM_2048/hnm_3_gold_dataset_ratio_1_1.5'
    train: &train_defaults
      epochs: 800
      imgsz: 512
      batch_size: 6
      workers: 4
      patience: 50
      lr0: 0.0001
      amp: True
      degrees: 20
      translate: 0.1
      scale: 0
      fliplr: 0.5
      flipud: 0.5
      gradient_accumulation_steps: 8
    post_tests:
      - test_name: 'Standard_Eval'
        dataset:
          path: '/home/sean/oil_11_26/dataset/DV4_SAR_Small_v3_relabel/04_HNM_Experiments/VV_HNM_2048/hnm_3_gold_dataset_ratio_1_1.5'
        reconstruction:
          enabled: true
          original_data_root: '/home/sean/oil_11_26/dataset/DV4_SAR_Small_v3_relabel/00_Raw_Source'
          original_patch_size: 2048

